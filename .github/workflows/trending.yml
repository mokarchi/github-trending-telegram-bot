name: GitHub Trending to Telegram

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Period to send"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - daily
          - weekly
          - monthly
          - dotnet
          - all
  schedule:
    # Run at an off-peak minute to reduce GitHub Actions scheduler delays.
    - cron: "17 6 * * *"
      timezone: "Asia/Tehran"

concurrency:
  group: github-trending-telegram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Send trends
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          TIMEZONE: Asia/Tehran
          TOP_N: 10
          WEEKLY_DAY: 0
          MONTHLY_DAY: 1
          DOTNET_LOOKBACK_HOURS: 26
          DOTNET_MAX_ITEMS: 5
        run: python src/main.py --period "${{ github.event.inputs.period || 'auto' }}"
